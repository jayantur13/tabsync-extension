<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>TabSync - Settings</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --bg-panel: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 420px;
      margin: 0;
      padding: 1.5rem;
      background-color: var(--bg-main);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    .container {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
    }

    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    h3, h4 {
      margin: 0 0 1rem 0;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.4;
    }

    h4 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 160px;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    #status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 1rem;
      text-align: center;
      min-height: 1.25rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🧩 TabSync Options</h2>
    <h3>Requires <a href="https://www.npmjs.com/package/tabsync-cli" target="_blank">tabsync-cli</a> or <a
        href="https://github.com/jayantur13/tabsync-desktop/releases/" target="_blank">tabsync-desktop</a> running locally.</h3>
    <h4>Support development via <a href="https://github.com/sponsors/jayantur13" target="_blank">GitHub Sponsors</a> or <a
        href="https://www.buymeacoffee.com/jayantur13v" target="_blank">Buy Me a Coffee</a>.</h4>
    
    <form>
      <div class="form-group">
        <label for="portInput">Target Server Port:</label>
        <input id="portInput" type="number" placeholder="e.g. 3210" min="1000" max="65535">
      </div>
      <button id="saveBtn" type="button">Save Configuration</button>
    </form>
    
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>

</html>
